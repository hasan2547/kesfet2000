<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>محاضرة نظري MCQ رنين محاضرة 1</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: #202124;
            --accent-color: #0056b3;
            --trans-bg: #f8f9fa;
            --trans-border: #0056b3;
            --nav-bg: #f8f9fa;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Roboto', 'Cairo', sans-serif; background-color: var(--bg-color); color: var(--text-color); margin: 0; padding: 0; padding-bottom: 90px; min-height: 100vh; }
        
        .content-container { padding: 20px 20px; max-width: 800px; margin: 0 auto; direction: ltr; }
        .text-block { margin-bottom: 25px; border-bottom: 1px dashed #ddd; padding-bottom: 15px; }
        .title-text { font-weight: bold; font-size: 1.6rem; color: #000; margin-bottom: 15px; display: block; border-bottom: 3px solid var(--accent-color); padding-bottom: 10px; direction: ltr; }
        .sub-title { font-weight: bold; font-size: 1.4rem; color: var(--accent-color); margin-top: 20px; margin-bottom: 10px; display: block; direction: ltr; }
        
        .english-paragraph { line-height: 2.2; font-size: 1.25rem; color: #333; margin-bottom: 8px; text-align: left; }
        
        .interactive-word { cursor: pointer; border-bottom: 1px dotted #999; transition: background 0.2s; position: relative; display: inline-block;}
        .interactive-word:hover { background-color: #e3f2fd; color: var(--accent-color); }
        
        .toggle-trans-btn { background: none; border: none; color: #666; font-family: 'Cairo', sans-serif; font-size: 0.95rem; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 5px; padding: 5px 0; direction: rtl; width: 100%; }
        .toggle-trans-btn:hover { color: var(--accent-color); }
        
        .inline-translation { display: none; background-color: var(--trans-bg); color: #000; padding: 12px; border-radius: 8px; margin-top: 5px; border-right: 4px solid var(--trans-border); font-family: 'Cairo', sans-serif; font-size: 1.15rem; line-height: 1.6; direction: rtl; text-align: justify; }

        .lecture-image-container { width: 100%; margin: 20px 0; text-align: center; }
        .lecture-image { max-width: 100%; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); border: 1px solid #eee; }

        .print-btn-float { position: fixed; top: 15px; right: 15px; background: #28a745; color: white; border: none; padding: 10px 18px; border-radius: 50px; font-family: 'Cairo', sans-serif; font-weight: bold; font-size: 1rem; cursor: pointer; z-index: 1000; box-shadow: 0 4px 10px rgba(0,0,0,0.2); transition: all 0.3s;}
        .print-btn-float:active { transform: scale(0.95); }

        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; height: 70px; background-color: var(--nav-bg); border-top: 1px solid #e0e0e0; display: flex; justify-content: space-between; align-items: center; padding: 0 20px; z-index: 1000; direction: rtl; }
        .nav-btn { background: var(--accent-color); color: white; border: none; padding: 10px 24px; border-radius: 50px; font-family: 'Cairo', sans-serif; font-weight: bold; cursor: pointer; }
        .nav-btn:disabled { background-color: #e0e0e0; color: #999; }
        .page-counter { font-family: 'Cairo', sans-serif; font-weight: bold; color: #555; background: #e9ecef; padding: 5px 15px; border-radius: 15px; }

        .sheet-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 2000; opacity: 0; visibility: hidden; display: flex; align-items: flex-end; transition: all 0.3s;}
        .sheet-overlay.active { opacity: 1; visibility: visible; }
        .sheet-content { background: white; width: 100%; padding: 25px; border-top-left-radius: 25px; border-top-right-radius: 25px; text-align: center; transform: translateY(100%); transition: transform 0.3s;}
        .sheet-overlay.active .sheet-content { transform: translateY(0); }
        .selected-word-box { background-color: #e3f2fd; border: 1px solid #bbdefb; padding: 15px; border-radius: 12px; margin-top: 10px; }
        .sw-container { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 5px; }
        .audio-btn { background: none; border: none; cursor: pointer; font-size: 1.5rem; }
        .sw-english { font-family: 'Roboto', sans-serif; font-weight: bold; font-size: 1.4rem; color: var(--accent-color); }
        .sw-arabic { font-family: 'Cairo', sans-serif; font-size: 1.3rem; color: #333; font-weight: bold; display: block; }

        .slide-page { display: none; }
        .slide-page.active { display: block; animation: fadeIn 0.3s ease-in-out; }

        /* ================= إعدادات الطباعة الآمنة للصور والخطوط ================= */
        @page { size: A4 portrait; margin: 10mm; }
        @media print {
            body, html { width: 100%; background: white; color: black; margin: 0; padding: 0; }
            .bottom-nav, .sheet-overlay, .toggle-trans-btn, .print-btn-float { display: none !important; }
            
            .content-container { max-width: 100%; padding: 0; margin: 0; }
            
            /* إزالة إخفاء المحتوى الزائد، وترك الصفحة تأخذ راحتها لتفادي النقص */
            .slide-page { 
                display: block !important; 
                opacity: 1 !important; 
                visibility: visible !important; 
                position: relative !important; 
                page-break-after: always !important; 
                page-break-inside: avoid !important;
                width: 100% !important;
                padding: 0 !important; 
                margin: 0 !important; 
                box-sizing: border-box; 
            }
            
            .slide-content-wrapper {
                transform-origin: top center;
                width: 100%;
            }
            
            .text-block { border-bottom: 1px dashed #ccc; margin-bottom: 8px !important; padding-bottom: 5px !important;}
            .lecture-image-container { margin: 10px 0 !important; text-align: center; page-break-inside: avoid;}
            .lecture-image { max-height: 300px !important; max-width: 100% !important; object-fit: contain; }
            
            .inline-translation { display: block !important; font-size: 11pt !important; line-height: 1.5 !important; border-top: 1px dashed #bbb; margin-top: 8px !important; padding-top: 5px !important; color: #444; direction: rtl;}
            
            .interactive-word { border: none !important; position: relative; display: inline-block; margin-top: 22px;}
            .interactive-word[data-trans]::after {
                content: attr(data-trans);
                position: absolute;
                bottom: 100%;
                left: 50%;
                transform: translateX(-50%);
                font-size: 8pt !important;
                color: #cc0000 !important; 
                font-family: 'Cairo', sans-serif;
                white-space: nowrap;
                font-weight: bold;
                direction: rtl;
            }
        }
    </style>
</head>

ed in Spin Echo sequences D. T2* eliminates spin-spin interactions Answer: A. T2* includes effects of external magnetic field inhomogeneity ​ (⚠️ فشل الاتصال)", "words": {}, "isTitle": false, "isSubTitle": false}, {"type": "text", "text": "4. Which MRI sequence is most suitable for detecting areas of restricted diffusion, such as in brain infarcts? ​", "trans": "4. Which MRI sequence is most suitable for detecting areas of restricted diffusion, such as in brain infarcts? ​ (⚠️ فشل الاتصال)", "words": {}, "isTitle": false, "isSubTitle": false}, {"type": "text", "text": "A. Perfusion Weighted Imaging (PWI) ​ B. Diffusion Weighted Imaging (DWI) ​ C. Functional MRI (fMRI) ​ D. Magnetic Resonance Angiography (MRA) ​ Answer: B. Diffusion Weighted Imaging (DWI)", "trans": "A. Perfusion Weighted Imaging (PWI) ​ B. Diffusion Weighted Imaging (DWI) ​ C. Functional MRI (fMRI) ​ D. Magnetic Resonance Angiography (MRA) ​ Answer: B. Diffusion Weighted Imaging (DWI) (⚠️ فشل الاتصال)", "words": {}, "isTitle": false, "isSubTitle": false}]}, {"content": [{"type": "text", "text": "5. What is the purpose of the 180-degree RF pulse in Spin Echo sequences?", "trans": "5. What is the purpose of the 180-degree RF pulse in Spin Echo sequences? (⚠️ فشل الاتصال)", "words": {}, "isTitle": true, "isSubTitle": false}, {"type": "text", "text": "A. Flip longitudinal magnetization into the transverse plane ​ B. Rephase dephased transverse magnetization ​ C. Suppress fat signal ​ D. Enhance proton density contrast ​ Answer: B. ​ Rephase dephased transverse magnetization ​", "trans": "A. Flip longitudinal magnetization into the transverse plane ​ B. Rephase dephased transverse magnetization ​ C. Suppress fat signal ​ D. Enhance proton density contrast ​ Answer: B. ​ Rephase dephased transverse magnetization ​ (⚠️ فشل الاتصال)", "words": {}, "isTitle": false, "isSubTitle": false}, {"type": "text", "text": "6. In Gradient Echo (GRE) sequences, what happens to residual transverse magnetization in spoile                                     let clean = word.replace(/[^a-zA-Z]/g, '').toLowerCase();
                                    if (clean && /[a-z]/i.test(clean)) {
                                        let safeWord = word.replace(/'/g, "\'").replace(/"/g, "&quot;");
                                        let trans = localDict[clean] || fallbackDict[clean] || dictionary[clean] || "";
                                        let transAttr = trans ? `data-trans="${trans}"` : '';
                                        interactiveText += `<span class="interactive-word" data-clean="${clean}" ${transAttr} onclick="showWordMeaning('${clean}', '${safeWord}', this)">${word}</span> `;
                                    } else {
                                        interactiveText += `${word} `; 
                                    }
                                });
                                formattedBlock += `<div>${interactiveText}</div>`;
                            });

                            let transFormatted = (item.trans || "").replace(/\n/g, '<br>');

                            html += `
                                <div class="text-block">
                                    <div class="${cssClass}">
                                        ${formattedBlock}
                                    </div>
                                    <button class="toggle-trans-btn" onclick="toggleTranslation('trans-${pageIndex}-${idx}')">
                                        إظهار الترجمة &#11015;
                                    </button>
                                    <div id="trans-${pageIndex}-${idx}" class="inline-translation">
                                        <strong style="color:#0056b3;">الترجمة الطبية:</strong><br>${transFormatted}
                                    </div>
                                </div>
                            `;
                        }
                    });
                    html += `</div></div>`;
                });

                container.innerHTML = html;
                updateControls();
                
                fetchAllWordsTranslation();

            } catch(err) {
                console.error(err);
            }
        }

        // ================= نظام الطباعة الذكي (انتظار الصور + الكبس الدقيق) =================
        function printLecture() {
            const printBtn = document.getElementById('mainPrintBtn');
            printBtn.innerHTML = "⏳ جاري تجهيز الصور والملزمة...";
            
            const slides = document.querySelectorAll('.slide-page');
            
            // 1. فتح وعرض كل السلايدات أولاً حتى المتصفح يبدأ يحمل صورها
            slides.forEach(slide => {
                slide.style.display = 'block'; 
                slide.classList.add('active'); 
            });

            // 2. مراقبة الصور والتأكد من تحميلها بالكامل قبل الكبس والطباعة
            let images = Array.from(document.images);
            let promises = images.map(img => {
                if (img.complete) return Promise.resolve();
                return new Promise(resolve => {
                    img.onload = resolve;
                    img.onerror = resolve; // نكمل حتى لو فشلت الصورة حتى لا يعلق
                });
            });

            // 3. بعد تحميل الصور وتمددها بحجمها الحقيقي، نقوم بالكبس
            Promise.all(promises).then(() => {
                printBtn.innerHTML = "⏳ جاري ترتيب الصفحات...";
                
                slides.forEach(slide => {
                    const wrapper = slide.querySelector('.slide-content-wrapper');
                    if (wrapper) {
                        wrapper.style.zoom = 1; 
                        let scrollH = wrapper.scrollHeight;
                        let targetH = 1000; // حجم ورقة A4 التقديري (مع الهوامش)
                        
                        // كبس السلايد إذا كان طويلاً جداً
                        if (scrollH > targetH) {
                            wrapper.style.zoom = targetH / scrollH; 
                        }
                    }
                });

                // 4. إعطاء المتصفح لحظة لتطبيق الكبس ثم فتح نافذة الطباعة
                setTimeout(() => {
                    printBtn.innerHTML = "🖨️ حفظ كـ PDF";
                    window.print();

                    // 5. إرجاع الموقع لسلايد واحد بعد الإغلاق
                    setTimeout(() => {
                        slides.forEach((slide) => {
                            slide.style.display = '';
                            const wrapper = slide.querySelector('.slide-content-wrapper');
                            if(wrapper) wrapper.style.zoom = 1;
                        });
                        renderPage();
                    }, 1000);
                }, 500);
            });
        }

        // ================= دالة الجلب الشامل لترجمة الكلمات =================
        async function fetchAllWordsTranslation() {
            const spans = document.querySelectorAll('.interactive-word');
            let missingWords = new Set();
            
            spans.forEach(span => {
                let clean = span.getAttribute('data-clean');
                if (clean && !span.getAttribute('data-trans')) {
                    missingWords.add(clean);
                }
            });

            let wordsArray = Array.from(missingWords);
            if (wordsArray.length === 0) return;

            const printBtn = document.getElementById('mainPrintBtn');
            printBtn.innerHTML = "⏳ جاري استخراج الكلمات للـ PDF...";
            printBtn.style.background = "#ff9800";

            let chunkSize = 40;
            for (let i = 0; i < wordsArray.length; i += chunkSize) {
                let chunk = wordsArray.slice(i, i + chunkSize);
                let query = chunk.join('\n');
                try {
                    let res = await fetch('https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=ar&dt=t&q=' + encodeURIComponent(query));
                    let data = await res.json();
                    
                    let translatedLines = [];
                    data[0].forEach(item => {
                        if (item[0]) {
                            translatedLines.push(item[0].replace(/[^\u0600-\u06FF\s]/g, '').trim());
                        }
                    });

                    chunk.forEach((word, idx) => {
                        let trans = translatedLines[idx] || word;
                        if(!trans) trans = word;
                        dictionary[word] = trans;
                        document.querySelectorAll(`span[data-clean="${word}"]`).forEach(el => {
                            el.setAttribute('data-trans', trans);
                        });
                    });
                } catch(e) { console.error(e); }
            }
            
            printBtn.innerHTML = "🖨️ حفظ كـ PDF";
            printBtn.style.background = "#28a745";
        }

        function updateControls() {
            document.getElementById('pageIndicator').innerText = (currentIndex + 1) + " / " + pages.length;
            document.getElementById('prevBtn').disabled = currentIndex === 0;
            document.getElementById('nextBtn').disabled = currentIndex === pages.length - 1;
        }

        function changePage(dir) {
            document.getElementById(`page-${currentIndex}`).classList.remove('active');
            currentIndex += dir;
            document.getElementById(`page-${currentIndex}`).classList.add('active');
            updateControls();
            window.scrollTo(0,0);
        }

        function toggleTranslation(id) {
            const el = document.getElementById(id);
            if (el.style.display === "block") {
                el.style.display = "none";
            } else {
                el.style.display = "block";
            }
        }

        let currentWordForAudio = "";

        async function showWordMeaning(cleanWord, originalWord, element) {
            currentWordForAudio = originalWord.replace(/[^a-zA-Z]/g, '');
            const enSpan = document.getElementById('swEnglish');
            const arSpan = document.getElementById('swArabic');
            
            enSpan.innerText = currentWordForAudio;
            const overlay = document.getElementById('sheetOverlay');
            overlay.classList.add('active');

            if (element && element.getAttribute('data-trans')) {
                arSpan.innerText = element.getAttribute('data-trans');
            } else {
                arSpan.innerText = fallbackDict[cleanWord] || "جاري الترجمة...";
            }
        }

        function playAudio() {
            if (currentWordForAudio) {
                const utterance = new SpeechSynthesisUtterance(currentWordForAudio);
                utterance.lang = 'en-US'; 
                window.speechSynthesis.speak(utterance);
            }
        }

        function closeSheet(e) {
            if (e.target.id === 'sheetOverlay') {
                const overlay = document.getElementById('sheetOverlay');
                overlay.classList.remove('active');
            }
        }

        renderPage();

    </script>
</body>
